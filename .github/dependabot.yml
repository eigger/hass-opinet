version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Preserve the supported HA version and its required minimum build toolchain.
    exclude-paths:
      - requirements_test_minimum_ha.txt
      - requirements_build_minimum.txt
    groups:
      home-assistant-tests:
        patterns:
          - homeassistant
          - pytest-homeassistant-custom-component
