# Shared standards; upstream action SHAs verified 2026-10-17.
name: Update dependencies
'on':
  schedule:
  - cron: 41 4 * * 1
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  dependencies:
    permissions:
      contents: write
      pull-requests: write
    uses: eigger/hass-repo-standards/.github/workflows/dependency-update.yml@6839346bc5e2a11157fecd800f4cb490fc3197ab # reviewed central main
    with:
      standards-ref: 6839346bc5e2a11157fecd800f4cb490fc3197ab
      domain: opinet
      packages: '["pyproj"]'
      python-version: '3.14'
      test-profile: ha
      validation-command: python -m ruff check . && python -m ruff format --check . && python -m pytest tests/components/opinet/ -v
