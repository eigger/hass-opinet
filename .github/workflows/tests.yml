# Shared standards; upstream action SHAs verified 2026-10-17.
name: Tests
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  current:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@ca740d88b32fa5dcbc94c41fce2908450c76ed50 # reviewed central main
    with:
      standards-ref: ca740d88b32fa5dcbc94c41fce2908450c76ed50
      domain: opinet
      python-versions: '["3.14"]'
      requirements: requirements_test.txt
      expected-ha-version: '2026.10.2'
      test-profile: ha
      pytest-args: tests/components/opinet/ -v
  minimum-ha:
    uses: eigger/hass-repo-standards/.github/workflows/python-tests.yml@ca740d88b32fa5dcbc94c41fce2908450c76ed50 # reviewed central main
    with:
      standards-ref: ca740d88b32fa5dcbc94c41fce2908450c76ed50
      domain: opinet
      python-versions: '["3.14"]'
      requirements: requirements_test_minimum_ha.txt
      expected-ha-version: '2026.9.0'
      test-profile: ha
      pytest-args: tests/components/opinet/ -v
